<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white flex items-center justify-center min-h-screen text-gray-900">
    <!-- Design

  Embracing Minimalism

  From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.

  Annie Spratt -->
  <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-lg">
    <div class="step" id="step-1">
      <img src="./resources/Cactus.jpg" alt="Cactus" class="w-full h-auto rounded-lg mb-4">
      <button class="w-1/4 h-1/2 bg-[#F5EFFF] text-[#A294F9] text-sm font-bold rounded-2xl">Design</button>
      <h2 class="text-2xl font-bold mb-2">Embracing Minimalism</h2>
      <p class="text-gray-600 mb-4">From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.</p>
    </div>
    <div class="spacer h-[1px] bg-gray-300 rounded-full my-4"></div>
    <p class="text-gray-600 mb-4">Annie Spartt</p>
  </div>
   
  </body>
</html>
