<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <script src="https://cdn.tailwindcss.com"></script>
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
 
</head>
<body class="bg-red-100">
  <div class="flex justify-center items-center min-h-screen">
    <div class="flex flex-col w-1/2 md:flex-row bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="md:w-1/2 p-6">
        <img src="images/image-product-desktop.jpg" alt="Product Image" class="w-full h-full">
        </div>
        <div class="md:w-1/2 p-6">
          <h2 class="text-3xl font-bold mb-4">Perfume</h2>
          <h1 class="text-5xl font-bold mb-4">Gabrella Essence Eau de Parfum</h1>
          <p class="text-gray-500 mb-4">A floral, solar voluptuous interpretation composed by Oliver Polge, Perfume-creator for house of CHANEL</p>
          <div class="flex items-center mb-4">
            <p class="text-3xl font-bold mr-2">$149.99</p>
            <p class="text-gray-500 line-through">$169.99</p>
            </div>
            <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
              <img src="images/icon-cart.svg" alt="Cart Icon" class="inline-block mr-2">
              Add to Cart
              </button>
              </div>
              </div>
             
  </div>

</body>
</html>
